command.view.panRight=Pan Right
command.view.panRight.desc=Moves the view of a zoomed-in image right.
command.view.panUp=Pan Up
command.view.panUp.desc=Moves the view of a zoomed-in image up.
command.view.panDown=Pan Down
command.view.panDown.desc=Moves the view of a zoomed-in image down.
command.view.actualSize=Actual Size
