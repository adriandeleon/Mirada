command.view.zoomOut=Zoom Out
command.view.zoomOut.desc=Zooms to the previous step, about the centre of the window.
command.view.zoomToFit=Zoom to Fit
command.view.zoomToFit.desc=Shows the whole image, fitted to the window.
command.view.keepZoom=Keep Zoom When Stepping
