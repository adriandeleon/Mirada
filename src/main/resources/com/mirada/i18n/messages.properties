command.go.last=Last Image
command.go.last.desc=Jumps to the last image in the folder.
command.go.toImage=Go to Image…
command.go.toImage.desc=Finds an image in the folder by its name, and shows it.
command.view.slideshow=Slideshow
command.view.slideshow.desc=Shows the folder's images one after another, full screen. Escape stops it.
command.view.zoomIn=Zoom In
