# Mirada's interface in English, the base catalog (Pauta INTL-01). Every other language's
# messages_<code>.properties has exactly these keys (MessagesTest). A value with a placeholder ({0})
# is a MessageFormat pattern: a literal apostrophe in it is doubled; a value without one is shown as
# written. command.<id> is a command's title and command.<id>.desc its palette line (KBD-03, PAL-02).

# Commands
command.go.next=Next Image
command.go.next.desc=Shows the next image in the folder.
command.go.previous=Previous Image
command.go.previous.desc=Shows the previous image in the folder.
command.go.first=First Image
