command.image.rotateRight.desc=Turns the image a quarter clockwise. The file is not changed.
command.image.rotateLeft=Rotate Left
command.image.rotateLeft.desc=Turns the image a quarter counterclockwise. The file is not changed.
command.view.fullScreen=Full Screen
command.view.fullScreen.desc=Fills the screen with the image. Escape leaves.
command.image.edit=Edit…
