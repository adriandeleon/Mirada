settings.theme.description=Light or dark controls and backgrounds.
settings.language.title=Language
settings.language.description=The language Mirada's windows and menus are in, from its next start.
settings.thumbnailsAtStart.title=Thumbnails at start
settings.thumbnailsAtStart.description=Opens the thumbnail strip when Mirada starts. T toggles it.
settings.propertiesAtStart.title=Properties at start
settings.propertiesAtStart.description=Opens the properties sidebar when Mirada starts. I toggles it.
settings.checkForUpdates.title=Check for updates
settings.checkForUpdates.description=Once a day, a few seconds after start, asks GitHub whether a newer Mirada is out, and says so in the status bar. Nothing is downloaded.
settings.statusBar.title=Status bar
settings.statusBar.description=A line along the bottom saying what the last command did; a click on it lists every message.
settings.hideControlsAfter.title=Hide controls after
settings.hideControlsAfter.description=Seconds without moving the pointer before the floating controls fade.
settings.keepZoom.title=Keep zoom when stepping
settings.keepZoom.description=Moving to another image keeps the zoom and position, to compare the same detail across shots. Z toggles it.
settings.thumbnailsAtSide.title=Thumbnails at the side
settings.thumbnailsAtSide.description=A column down the left of the window instead of a row along the bottom.
settings.thumbnailCaptions.title=File names under thumbnails
settings.thumbnailCaptions.description=Each thumbnail has its file name written under it.
settings.thumbnailNames.title=File names instead of pictures
settings.thumbnailNames.description=The strip lists the folder by name, and loads no thumbnails.
settings.sortBy.title=Sort by
settings.sortBy.description=The order images are stepped through.
settings.reverseOrder.title=Reverse order
settings.reverseOrder.description=Last first: newest, largest, or Z to A.
settings.slideshowSpeed.title=Slideshow speed
settings.slideshowSpeed.description=Seconds each image shows in a slideshow. F5 starts it.
settings.keymap.title=Keymap
settings.keymap.description=Mirada's own keys, or Emacs's. Your own go on top of it: keys.<command id> in the settings file.
settings.paletteKeys.title=Command palette
settings.paletteKeys.description=The keys that open the palette. Add a key, then press it; pressing one already listed takes it off.
settings.exportImport.title=Export and import
settings.exportImport.description=Export saves the settings, keys, bookmarks and notes in a zip, to keep or to take to another computer; Import puts back the parts you choose.

