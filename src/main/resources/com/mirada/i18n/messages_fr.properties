# Mirada's interface in French (fr). Same keys as messages.properties.
# A value with a placeholder ({0}) is a MessageFormat pattern: a literal apostrophe in it is doubled; a
# value without one is shown as written. command.<id> is a command's title and command.<id>.desc its
# palette line (KBD-03, PAL-02).

# Commandes
command.go.next=Image suivante
command.go.next.desc=Affiche l'image suivante du dossier.
command.go.previous=Image précédente
command.go.previous.desc=Affiche l'image précédente du dossier.
command.go.first=Première image
command.go.first.desc=Va à la première image du dossier.
command.go.last=Dernière image
command.go.last.desc=Va à la dernière image du dossier.
command.go.toImage=Aller à l'image…
command.go.toImage.desc=Trouve une image du dossier par son nom, et l'affiche.
command.view.slideshow=Diaporama
command.view.slideshow.desc=Affiche les images du dossier l'une après l'autre, en plein écran. Échap l'arrête.
command.view.zoomIn=Zoom avant
command.view.zoomIn.desc=Zoome au palier suivant, autour du centre de la fenêtre.
command.view.zoomOut=Zoom arrière
command.view.zoomOut.desc=Zoome au palier précédent, autour du centre de la fenêtre.
command.view.zoomToFit=Ajuster à la fenêtre
command.view.zoomToFit.desc=Affiche l'image entière, ajustée à la fenêtre.
command.view.keepZoom=Garder le zoom d'une image à l'autre
command.view.keepZoom.desc=Active ou désactive la conservation du zoom et de la position en passant à une autre image.
command.view.panLeft=Défiler vers la gauche
command.view.panLeft.desc=Déplace vers la gauche la vue d'une image agrandie.
command.view.panRight=Défiler vers la droite
command.view.panRight.desc=Déplace vers la droite la vue d'une image agrandie.
command.view.panUp=Défiler vers le haut
command.view.panUp.desc=Déplace vers le haut la vue d'une image agrandie.
command.view.panDown=Défiler vers le bas
command.view.panDown.desc=Déplace vers le bas la vue d'une image agrandie.
command.view.actualSize=Taille réelle
command.view.actualSize.desc=Affiche l'image à 100 % : un pixel de l'image par pixel de l'écran.
command.image.rotateRight=Pivoter à droite
command.image.rotateRight.desc=Tourne l'image d'un quart de tour dans le sens horaire. Le fichier n'est pas modifié.
command.image.rotateLeft=Pivoter à gauche
command.image.rotateLeft.desc=Tourne l'image d'un quart de tour dans le sens antihoraire. Le fichier n'est pas modifié.
command.view.fullScreen=Plein écran
command.view.fullScreen.desc=Remplit l'écran avec l'image. Échap en sort.
command.image.edit=Modifier…
command.image.edit.desc=Recadre, tourne et retourne l'image, et enregistre le résultat dans un nouveau fichier.
command.file.rename=Renommer…
command.file.rename.desc=Renomme le fichier de l'image.
command.file.undoMoveToTrash=Annuler la mise à la Corbeille
command.file.undoMoveToTrash.desc=Remet à sa place l'image mise à la Corbeille en dernier.
command.image.copy=Copier
command.image.copy.desc=Copie l'image, telle qu'elle est à l'écran, et son fichier, pour les coller dans une autre application ou un dossier.
command.file.showInFolder=Afficher dans le dossier
command.file.showInFolder.desc=Ouvre le dossier de l'image dans le gestionnaire de fichiers, l'image sélectionnée.
command.file.moveToTrash=Mettre à la Corbeille
command.file.moveToTrash.desc=Met l'image à la Corbeille, d'où elle peut être remise en place, et affiche la suivante.
command.bookmark.image=Signet sur l'image
command.bookmark.image.desc=Marque l'image, pour la retrouver avec Aller au signet ou y aller dans son dossier. Une seconde fois retire la marque.
command.bookmark.folder=Signet sur le dossier
command.bookmark.folder.desc=Marque le dossier de l'image, pour le rouvrir avec Aller au signet. Une seconde fois retire la marque.
command.bookmark.noteOnImage=Note sur l'image…
command.bookmark.noteOnImage.desc=Écrit une note personnelle sur l'image. Mirada la conserve ; le fichier n'est pas modifié.
command.bookmark.noteOnFolder=Note sur le dossier…
command.bookmark.noteOnFolder.desc=Écrit une note personnelle sur le dossier de l'image. Mirada la conserve ; le dossier n'est pas modifié.
command.bookmark.next=Image à signet suivante
command.bookmark.next.desc=Va à l'image à signet suivante du dossier.
command.bookmark.previous=Image à signet précédente
command.bookmark.previous.desc=Va à l'image à signet précédente du dossier.
command.bookmark.goTo=Aller au signet…
command.bookmark.goTo.desc=Trouve une image ou un dossier à signet, ou avec une note, par son nom ou sa note, et l'ouvre.
command.bookmark.list=Signets et notes
command.bookmark.list.desc=Liste chaque signet et chaque note, par dossier, avec la miniature et la note de chaque image, pour les trouver, ouvrir, modifier ou retirer.
command.folder.sortByName=Trier par nom
command.folder.sortByName.desc=Classe le dossier par nom de fichier, en comptant comme une personne.
command.folder.sortByDate=Trier par date
command.folder.sortByDate.desc=Classe le dossier selon la dernière modification de chaque fichier.
command.folder.sortBySize=Trier par taille
command.folder.sortBySize.desc=Classe le dossier par taille de fichier.
command.folder.reverseOrder=Inverser l'ordre
command.folder.reverseOrder.desc=Inverse l'ordre du dossier.
command.view.properties=Propriétés de l'image
command.view.properties.desc=Affiche le dossier, la taille, le format, les dates du fichier et l'appareil à côté de l'image.
command.view.thumbnails=Miniatures
command.view.thumbnails.desc=Affiche les images du dossier dans une bande en bas de la fenêtre.
command.view.thumbnailsAtSide=Miniatures sur le côté
command.view.thumbnailsAtSide.desc=Dispose les miniatures en colonne à gauche plutôt qu'en rangée en bas.
command.view.thumbnailNames=Noms au lieu des miniatures
command.view.thumbnailNames.desc=Liste le dossier par nom de fichier dans la bande, au lieu des images.
command.view.thumbnailCaptions=Noms sous les miniatures
command.view.thumbnailCaptions.desc=Écrit le nom de fichier de chaque image sous sa miniature dans la bande.
command.window.escape=Échap
command.window.escape.desc=Arrête le diaporama ou quitte le plein écran ; sous Linux, sinon, ferme la fenêtre.
command.app.settings=Paramètres
command.app.settings.desc=Thème, ce qui s'ouvre au démarrage, et la durée d'affichage des contrôles flottants.
command.settings.theme=Thème…
command.settings.theme.desc=Choisit une interface et des arrière-plans clairs ou sombres, ou ceux du système.
command.settings.language=Langue…
command.settings.language.desc=Choisit la langue des fenêtres et des menus de Mirada, à partir de son prochain démarrage.
command.settings.keymap=Jeu de raccourcis…
command.settings.keymap.desc=Choisit les touches de départ de Mirada : les siennes, ou celles d'Emacs. Vos propres touches restent par-dessus.
command.settings.thumbnailsAtStart=Miniatures au démarrage
command.settings.thumbnailsAtStart.desc=Active ou désactive l'ouverture de la bande de miniatures au démarrage de Mirada.
command.settings.propertiesAtStart=Propriétés au démarrage
command.settings.propertiesAtStart.desc=Active ou désactive l'ouverture du panneau des propriétés au démarrage de Mirada.
command.settings.hideControlsAfter=Masquer les contrôles après…
command.settings.hideControlsAfter.desc=Choisit combien de secondes les contrôles flottants restent une fois le pointeur immobile.
command.settings.slideshowSpeed=Vitesse du diaporama…
command.settings.slideshowSpeed.desc=Choisit combien de secondes chaque image reste affichée dans un diaporama.
command.settings.paletteKeys=Touches de la palette de commandes…
command.settings.paletteKeys.desc=Ouvre les Paramètres en attente d'une touche : une fois pressée, elle ouvre la palette ; une touche déjà listée est retirée.
command.settings.checkForUpdatesDaily=Rechercher des mises à jour chaque jour
command.settings.checkForUpdatesDaily.desc=Active ou désactive la question posée à GitHub, une fois par jour, sur la sortie d'une version plus récente de Mirada.
command.config.export=Exporter la configuration…
command.config.export.desc=Enregistre les paramètres, les touches, les signets et les notes dans un zip, à garder ou à emporter sur un autre ordinateur.
command.config.import=Importer la configuration…
command.config.import.desc=Remplace les paramètres, les touches, ou les signets et les notes par ceux d'un zip exporté, après avoir demandé lesquels.
command.help.keyboardShortcuts=Raccourcis clavier
command.help.keyboardShortcuts.desc=Liste toutes les touches auxquelles Mirada répond.
command.help.about=À propos de Mirada
command.help.about.desc=Version, licence, et les versions de l'environnement d'exécution et des codecs.
command.view.statusBar=Barre d'état
command.view.statusBar.desc=Affiche la ligne en bas de la fenêtre qui indique ce qu'a fait la dernière commande.
command.view.messageLog=Journal des messages
command.view.messageLog.desc=Liste tout ce que la barre d'état a dit pendant cette session, du plus récent au plus ancien.
command.messages.copy=Copier les messages
command.messages.copy.desc=Copie les messages en texte : ceux qu'affiche le journal des messages, ou tous ceux de cette session.
command.messages.clear=Effacer les messages
command.messages.clear.desc=Vide le journal des messages et son compteur d'erreurs non lues.
command.help.debugLog=Journal de l'application
command.help.debugLog.desc=Affiche ce que Mirada a journalisé pendant cette session, les erreurs avec leurs détails, dans une fenêtre à part.
command.help.copyDebugLog=Copier le journal de l'application
command.help.copyDebugLog.desc=Copie le journal de l'application en texte.
command.help.exportDebugLog=Exporter le journal de l'application…
command.help.exportDebugLog.desc=Enregistre le journal de l'application dans un fichier texte.
command.help.clearDebugLog=Effacer le journal de l'application
command.help.clearDebugLog.desc=Vide le journal de l'application ici ; le fichier de session du dossier des paramètres garde son contenu.
command.help.reportProblem=Signaler un problème…
command.help.reportProblem.desc=Rédige un rapport sans les informations privées, que vous lisez et modifiez, puis ouvre un ticket GitHub avec. Rien n'est envoyé de lui-même.
command.help.checkForUpdates=Rechercher des mises à jour
command.help.checkForUpdates.desc=Demande à GitHub si une version plus récente de Mirada est sortie. Rien n'est téléchargé.
command.help.openRelease=Ouvrir la nouvelle version
command.help.openRelease.desc=Ouvre la page de la nouvelle version dans le navigateur, pour la télécharger depuis là.
command.file.open=Ouvrir une image…
command.file.open.desc=Ouvre une image, avec le reste de son dossier.
command.file.openFolder=Ouvrir un dossier…
command.file.openFolder.desc=Ouvre un dossier à sa première image.
command.file.openRecent=Ouvrir un dossier récent…
command.file.openRecent.desc=Trouve par son nom un dossier ouvert récemment, et l'ouvre.
command.window.close=Fermer la fenêtre
command.window.close.desc=Ferme Mirada.
command.palette.show=Palette de commandes
command.palette.show.desc=Trouve et exécute n'importe quelle commande par son nom.
command.help.documentation=Documentation
command.help.documentation.desc=Ouvre le guide d'utilisation de Mirada dans le navigateur.
command.help.copyDetails=Copier les détails
command.help.copyDetails.desc=Copie la version, le build, l'environnement d'exécution, le système et le fichier de paramètres, tels que les liste À propos, pour un rapport de bogue.
command.editor.rotateLeft=Édition : Pivoter à gauche
command.editor.rotateLeft.desc=Tourne l'image en cours de modification d'un quart de tour dans le sens antihoraire.
command.editor.rotateRight=Édition : Pivoter à droite
command.editor.rotateRight.desc=Tourne l'image en cours de modification d'un quart de tour dans le sens horaire.
command.editor.flipHorizontally=Édition : Retourner horizontalement
command.editor.flipHorizontally.desc=Retourne en miroir de gauche à droite l'image en cours de modification.
command.editor.flipVertically=Édition : Retourner verticalement
command.editor.flipVertically.desc=Retourne en miroir de haut en bas l'image en cours de modification.
command.editor.nextShape=Édition : Forme de recadrage suivante
command.editor.nextShape.desc=Contraint le recadrage à la forme suivante : libre, celle d'origine, carré, 5:4, 4:3, 3:2 ou 16:9.
command.editor.reset=Édition : Réinitialiser
command.editor.reset.desc=Annule chaque rotation, retournement et recadrage ; Annuler les rétablit.
command.editor.undo=Édition : Annuler
command.editor.undo.desc=Annule la dernière rotation, le dernier retournement, la dernière forme ou le dernier déplacement du recadrage.
command.editor.redo=Édition : Rétablir
command.editor.redo.desc=Refait ce qu'Annuler a défait.
command.editor.save=Édition : Enregistrer…
command.editor.save.desc=Demande où, puis écrit l'image modifiée dans un nouveau fichier ; l'original reste tel quel.
command.editor.cancel=Édition : Annuler la modification
command.editor.cancel.desc=Ferme l'éditeur sans enregistrer, après confirmation s'il y a une modification à perdre.
command.bookmarks.open=Signets : Ouvrir
command.bookmarks.open.desc=Ouvre le signet sélectionné dans la visionneuse : l'image, ou le dossier à sa première image.
command.bookmarks.editNote=Signets : Modifier la note…
command.bookmarks.editNote.desc=Écrit ou modifie la note de l'image ou du dossier sélectionné.
command.bookmarks.toggleBookmark=Signets : Ajouter ou retirer le signet
command.bookmarks.toggleBookmark.desc=Met le signet sur l'image ou le dossier sélectionné, ou le retire ; sa note reste.
command.bookmarks.showInFolder=Signets : Afficher dans le dossier
command.bookmarks.showInFolder.desc=Ouvre le dossier de l'image sélectionnée dans le gestionnaire de fichiers, l'image sélectionnée.
command.bookmarks.remove=Signets : Retirer
command.bookmarks.remove.desc=Retire le signet et la note de l'image ou du dossier sélectionné, après confirmation s'il a une note.
command.bookmarks.listAll=Signets : Tout lister
command.bookmarks.listAll.desc=Liste chaque signet et chaque note.
command.bookmarks.listBookmarked=Signets : Signets seulement
command.bookmarks.listBookmarked.desc=Liste seulement ce qui a un signet.
command.bookmarks.listNotes=Signets : Notes seulement
command.bookmarks.listNotes.desc=Liste seulement ce qui a une note.

