# Mirada's interface in German (de). Same keys as messages.properties.
# Anrede wie in Editora: Sie. Begriffe wie in Editora: Befehlspalette, Einstellungen, Lesezeichen,
# Tastenbelegung, Anwendungsprotokoll (Debug Log), Nachrichtenprotokoll (Message Log), Papierkorb.

# Befehle
command.go.next=Nächstes Bild
command.go.next.desc=Zeigt das nächste Bild im Ordner.
command.go.previous=Vorheriges Bild
command.go.previous.desc=Zeigt das vorherige Bild im Ordner.
command.go.first=Erstes Bild
command.go.first.desc=Springt zum ersten Bild im Ordner.
command.go.last=Letztes Bild
command.go.last.desc=Springt zum letzten Bild im Ordner.
command.go.toImage=Zu Bild springen…
command.go.toImage.desc=Sucht ein Bild im Ordner nach seinem Namen und zeigt es.
command.view.slideshow=Diashow
command.view.slideshow.desc=Zeigt die Bilder des Ordners nacheinander im Vollbild. Escape beendet sie.
command.view.zoomIn=Vergrößern
command.view.zoomIn.desc=Zoomt eine Stufe hinein, um die Fenstermitte.
command.view.zoomOut=Verkleinern
command.view.zoomOut.desc=Zoomt eine Stufe heraus, um die Fenstermitte.
command.view.zoomToFit=In Fenster einpassen
command.view.zoomToFit.desc=Zeigt das ganze Bild, ins Fenster eingepasst.
command.view.keepZoom=Zoom beim Blättern beibehalten
command.view.keepZoom.desc=Schaltet ein oder aus, dass Zoom und Position beim Wechsel zu einem anderen Bild erhalten bleiben.
command.view.panLeft=Nach links schieben
command.view.panLeft.desc=Verschiebt den Ausschnitt eines vergrößerten Bildes nach links.
command.view.panRight=Nach rechts schieben
command.view.panRight.desc=Verschiebt den Ausschnitt eines vergrößerten Bildes nach rechts.
command.view.panUp=Nach oben schieben
command.view.panUp.desc=Verschiebt den Ausschnitt eines vergrößerten Bildes nach oben.
command.view.panDown=Nach unten schieben
command.view.panDown.desc=Verschiebt den Ausschnitt eines vergrößerten Bildes nach unten.
command.view.actualSize=Originalgröße
command.view.actualSize.desc=Zeigt das Bild bei 100 %: ein Bildpixel pro Bildschirmpixel.
command.image.rotateRight=Nach rechts drehen
command.image.rotateRight.desc=Dreht das Bild um eine Vierteldrehung im Uhrzeigersinn. Die Datei bleibt unverändert.
command.image.rotateLeft=Nach links drehen
command.image.rotateLeft.desc=Dreht das Bild um eine Vierteldrehung gegen den Uhrzeigersinn. Die Datei bleibt unverändert.
command.view.fullScreen=Vollbild
command.view.fullScreen.desc=Füllt den Bildschirm mit dem Bild. Escape beendet es.
command.image.edit=Bearbeiten…
command.image.edit.desc=Schneidet das Bild zu, dreht und spiegelt es und speichert das Ergebnis als neue Datei.
command.file.rename=Umbenennen…
command.file.rename.desc=Benennt die Datei des Bildes um.
command.file.undoMoveToTrash=Verschieben in den Papierkorb rückgängig machen
command.file.undoMoveToTrash.desc=Legt das zuletzt in den Papierkorb verschobene Bild wieder an seinen Platz zurück.
command.image.copy=Kopieren
command.image.copy.desc=Kopiert das Bild, wie es auf dem Bildschirm steht, und seine Datei, zum Einfügen in eine andere App oder einen Ordner.
command.file.showInFolder=Im Ordner anzeigen
command.file.showInFolder.desc=Öffnet den Ordner des Bildes im Dateimanager, mit dem Bild ausgewählt.
command.file.moveToTrash=In den Papierkorb verschieben
command.file.moveToTrash.desc=Verschiebt das Bild in den Papierkorb, aus dem es sich zurücklegen lässt, und zeigt das nächste.
command.bookmark.image=Lesezeichen für Bild
command.bookmark.image.desc=Markiert das Bild, um es mit „Zu Lesezeichen springen“ wiederzufinden oder im Ordner anzuspringen. Erneut entfernt die Markierung.
command.bookmark.folder=Lesezeichen für Ordner
command.bookmark.folder.desc=Markiert den Ordner des Bildes, um ihn mit „Zu Lesezeichen springen“ wieder zu öffnen. Erneut entfernt die Markierung.
command.bookmark.noteOnImage=Notiz zum Bild…
command.bookmark.noteOnImage.desc=Schreibt eine eigene Notiz zum Bild. Mirada bewahrt sie auf; die Datei bleibt unverändert.
command.bookmark.noteOnFolder=Notiz zum Ordner…
command.bookmark.noteOnFolder.desc=Schreibt eine eigene Notiz zum Ordner des Bildes. Mirada bewahrt sie auf; der Ordner bleibt unverändert.
command.bookmark.next=Nächstes Bild mit Lesezeichen
command.bookmark.next.desc=Springt zum nächsten Bild mit Lesezeichen im Ordner.
command.bookmark.previous=Vorheriges Bild mit Lesezeichen
command.bookmark.previous.desc=Springt zum vorherigen Bild mit Lesezeichen im Ordner.
command.bookmark.goTo=Zu Lesezeichen springen…
command.bookmark.goTo.desc=Sucht ein Bild oder einen Ordner mit Lesezeichen oder Notiz nach Name oder Notiz und öffnet es.
command.bookmark.list=Lesezeichen und Notizen
command.bookmark.list.desc=Listet alle Lesezeichen und Notizen nach Ordner, mit Miniatur und Notiz jedes Bildes, zum Finden, Öffnen, Bearbeiten oder Entfernen.
command.folder.sortByName=Nach Name sortieren
command.folder.sortByName.desc=Ordnet den Ordner nach Dateinamen, wie ein Mensch zählt.
command.folder.sortByDate=Nach Datum sortieren
command.folder.sortByDate.desc=Ordnet den Ordner danach, wann jede Datei zuletzt geändert wurde.
command.folder.sortBySize=Nach Größe sortieren
command.folder.sortBySize.desc=Ordnet den Ordner nach Dateigröße.
command.folder.reverseOrder=Reihenfolge umkehren
command.folder.reverseOrder.desc=Kehrt die Reihenfolge des Ordners um.
command.view.properties=Bildeigenschaften
command.view.properties.desc=Zeigt Ordner, Größe, Format, Dateidaten und Kamera neben dem Bild.
command.view.thumbnails=Miniaturen
command.view.thumbnails.desc=Zeigt die Bilder des Ordners in einer Leiste am unteren Rand.
command.view.thumbnailsAtSide=Miniaturen seitlich
command.view.thumbnailsAtSide.desc=Stellt die Miniaturen in einer Spalte links statt in einer Zeile am unteren Rand dar.
command.view.thumbnailNames=Namen statt Miniaturen
command.view.thumbnailNames.desc=Listet den Ordner in der Leiste nach Dateinamen statt mit Bildern.
command.view.thumbnailCaptions=Namen unter Miniaturen
command.view.thumbnailCaptions.desc=Schreibt in der Leiste unter jede Miniatur den Dateinamen des Bildes.
command.window.escape=Escape
command.window.escape.desc=Beendet die Diashow oder das Vollbild; unter Linux schließt es sonst das Fenster.
command.app.settings=Einstellungen
command.app.settings.desc=Design, was beim Start geöffnet wird und wie lange die schwebenden Bedienelemente bleiben.
command.settings.theme=Design…
command.settings.theme.desc=Wählt helle oder dunkle Bedienelemente und Hintergründe oder die des Systems.
command.settings.language=Sprache…
command.settings.language.desc=Wählt die Sprache der Fenster und Menüs von Mirada, ab dem nächsten Start.
command.settings.keymap=Tastenbelegung…
command.settings.keymap.desc=Wählt die Tasten, von denen Mirada ausgeht: die eigenen oder die von Emacs. Ihre eigenen Tasten haben Vorrang.
command.settings.thumbnailsAtStart=Miniaturen beim Start
command.settings.thumbnailsAtStart.desc=Schaltet ein oder aus, ob die Miniaturleiste beim Start von Mirada geöffnet wird.
command.settings.propertiesAtStart=Eigenschaften beim Start
command.settings.propertiesAtStart.desc=Schaltet ein oder aus, ob die Eigenschaften-Seitenleiste beim Start von Mirada geöffnet wird.
command.settings.hideControlsAfter=Bedienelemente ausblenden nach…
command.settings.hideControlsAfter.desc=Wählt, wie viele Sekunden die schwebenden Bedienelemente bleiben, wenn der Zeiger stillsteht.
command.settings.slideshowSpeed=Diashow-Tempo…
command.settings.slideshowSpeed.desc=Wählt, wie viele Sekunden jedes Bild in einer Diashow angezeigt wird.
command.settings.paletteKeys=Tasten der Befehlspalette…
command.settings.paletteKeys.desc=Öffnet die Einstellungen und wartet auf eine Taste: Gedrückt öffnet sie fortan die Palette; eine bereits aufgeführte wird entfernt.
command.settings.checkForUpdatesDaily=Täglich nach Updates suchen
command.settings.checkForUpdatesDaily.desc=Schaltet ein oder aus, dass Mirada einmal am Tag bei GitHub nach einer neueren Version fragt.
command.config.export=Konfiguration exportieren…
command.config.export.desc=Speichert Einstellungen, Tasten, Lesezeichen und Notizen in einer ZIP-Datei, zum Aufbewahren oder für einen anderen Computer.
command.config.import=Konfiguration importieren…
command.config.import.desc=Ersetzt die Einstellungen, die Tasten oder die Lesezeichen und Notizen durch die einer exportierten ZIP-Datei, nach Rückfrage, welche.
command.help.keyboardShortcuts=Tastenkürzel
command.help.keyboardShortcuts.desc=Listet alle Tasten, auf die Mirada reagiert.
command.help.about=Über Mirada
command.help.about.desc=Version, Lizenz und die Versionen von Laufzeitumgebung und Codecs.
command.view.statusBar=Statusleiste
command.view.statusBar.desc=Zeigt die Zeile am unteren Fensterrand, die sagt, was der letzte Befehl getan hat.
command.view.messageLog=Nachrichtenprotokoll
command.view.messageLog.desc=Listet alles, was die Statusleiste in dieser Sitzung gemeldet hat, das Neueste zuerst.
command.messages.copy=Nachrichten kopieren
command.messages.copy.desc=Kopiert die Nachrichten als Text: die im Nachrichtenprotokoll angezeigten oder alle dieser Sitzung.
command.messages.clear=Nachrichten leeren
command.messages.clear.desc=Leert das Nachrichtenprotokoll und seinen Zähler ungelesener Fehler.
command.help.debugLog=Anwendungsprotokoll
command.help.debugLog.desc=Zeigt in einem eigenen Fenster, was Mirada in dieser Sitzung protokolliert hat, Fehler mit ihren Details.
command.help.copyDebugLog=Anwendungsprotokoll kopieren
command.help.copyDebugLog.desc=Kopiert das Anwendungsprotokoll als Text.
command.help.exportDebugLog=Anwendungsprotokoll exportieren…
command.help.exportDebugLog.desc=Speichert das Anwendungsprotokoll in einer Textdatei.
command.help.clearDebugLog=Anwendungsprotokoll leeren
command.help.clearDebugLog.desc=Leert das Anwendungsprotokoll hier; die Sitzungsdatei im Einstellungsordner behält ihren Inhalt.
command.help.reportProblem=Problem melden…
command.help.reportProblem.desc=Erstellt einen Bericht ohne private Angaben, den Sie lesen und bearbeiten können, und öffnet damit ein GitHub-Issue. Nichts wird von selbst gesendet.
command.help.checkForUpdates=Nach Updates suchen
command.help.checkForUpdates.desc=Fragt bei GitHub, ob es eine neuere Mirada-Version gibt. Es wird nichts heruntergeladen.
command.help.openRelease=Neue Version öffnen
command.help.openRelease.desc=Öffnet die Seite der neueren Version im Browser, um sie dort herunterzuladen.
command.file.open=Bild öffnen…
command.file.open.desc=Öffnet ein Bild mitsamt dem Rest seines Ordners.
command.file.openFolder=Ordner öffnen…
command.file.openFolder.desc=Öffnet einen Ordner bei seinem ersten Bild.
command.file.openRecent=Zuletzt geöffnet…
command.file.openRecent.desc=Sucht einen kürzlich geöffneten Ordner nach seinem Namen und öffnet ihn.
command.window.close=Fenster schließen
command.window.close.desc=Schließt Mirada.
command.palette.show=Befehlspalette
command.palette.show.desc=Sucht und führt jeden Befehl nach Namen aus.
command.help.documentation=Dokumentation
command.help.documentation.desc=Öffnet das Benutzerhandbuch von Mirada im Browser.
command.help.copyDetails=Details kopieren
command.help.copyDetails.desc=Kopiert Version, Build, Laufzeitumgebung, System und Einstellungsdatei, wie „Über“ sie aufführt, für einen Fehlerbericht.
command.editor.rotateLeft=Bearbeiten: Nach links drehen
command.editor.rotateLeft.desc=Dreht das bearbeitete Bild um eine Vierteldrehung gegen den Uhrzeigersinn.
command.editor.rotateRight=Bearbeiten: Nach rechts drehen
command.editor.rotateRight.desc=Dreht das bearbeitete Bild um eine Vierteldrehung im Uhrzeigersinn.
command.editor.flipHorizontally=Bearbeiten: Horizontal spiegeln
command.editor.flipHorizontally.desc=Spiegelt das bearbeitete Bild von links nach rechts.
command.editor.flipVertically=Bearbeiten: Vertikal spiegeln
command.editor.flipVertically.desc=Spiegelt das bearbeitete Bild von oben nach unten.
command.editor.nextShape=Bearbeiten: Nächste Zuschnittform
command.editor.nextShape.desc=Hält den Zuschnitt in der nächsten Form: frei, wie das Original, quadratisch, 5:4, 4:3, 3:2 oder 16:9.
command.editor.reset=Bearbeiten: Zurücksetzen
command.editor.reset.desc=Nimmt alle Drehungen, Spiegelungen und den Zuschnitt zurück; Rückgängig stellt sie wieder her.
command.editor.undo=Bearbeiten: Rückgängig
command.editor.undo.desc=Nimmt die letzte Drehung, Spiegelung, Form oder Verschiebung des Zuschnitts zurück.
command.editor.redo=Bearbeiten: Wiederholen
command.editor.redo.desc=Stellt wieder her, was Rückgängig zurückgenommen hat.
command.editor.save=Bearbeiten: Speichern…
command.editor.save.desc=Fragt nach dem Ort und schreibt das bearbeitete Bild als neue Datei; das Original bleibt unverändert.
command.editor.cancel=Bearbeiten: Abbrechen
command.editor.cancel.desc=Schließt den Editor ohne zu speichern, mit Rückfrage, wenn eine Bearbeitung verloren ginge.
command.bookmarks.open=Lesezeichen: Öffnen
command.bookmarks.open.desc=Öffnet das ausgewählte Lesezeichen im Betrachter: das Bild oder den Ordner bei seinem ersten Bild.
command.bookmarks.editNote=Lesezeichen: Notiz bearbeiten…
command.bookmarks.editNote.desc=Schreibt oder ändert die Notiz zum ausgewählten Bild oder Ordner.
command.bookmarks.toggleBookmark=Lesezeichen: Setzen oder entfernen
command.bookmarks.toggleBookmark.desc=Setzt das Lesezeichen für das ausgewählte Bild oder den Ordner oder entfernt es; die Notiz bleibt.
command.bookmarks.showInFolder=Lesezeichen: Im Ordner anzeigen
command.bookmarks.showInFolder.desc=Öffnet den Ordner des ausgewählten Bildes im Dateimanager, mit dem Bild ausgewählt.
command.bookmarks.remove=Lesezeichen: Entfernen
command.bookmarks.remove.desc=Entfernt Lesezeichen und Notiz vom ausgewählten Bild oder Ordner, mit Rückfrage, wenn es eine Notiz hat.
command.bookmarks.listAll=Lesezeichen: Alle anzeigen
command.bookmarks.listAll.desc=Listet alle Lesezeichen und alle Notizen.
command.bookmarks.listBookmarked=Lesezeichen: Nur Lesezeichen anzeigen
command.bookmarks.listBookmarked.desc=Listet nur, was ein Lesezeichen hat.
command.bookmarks.listNotes=Lesezeichen: Nur Notizen anzeigen
command.bookmarks.listNotes.desc=Listet nur, was eine Notiz hat.

