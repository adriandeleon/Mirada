# Mirada's interface in Portuguese (pt, Brazilian). Same keys as messages.properties.
# Um valor com marcador ({0}) é um padrão MessageFormat: nele, um apóstrofo literal é duplicado; um
# valor sem marcador é exibido como está. command.<id> é o título de um comando e command.<id>.desc
# sua linha na paleta (KBD-03, PAL-02).

