# Build and test on all three platforms.
#
# Mirada is meant to be cross-platform, and only Linux has ever run it. This is where Windows and
# macOS compile and test it on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

# Read-only: nothing here publishes.
permissions:
  contents: read

concurrency:
  # A newer push supersedes an older one on the same branch; nothing is learned from finishing a run
  # against code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests, NullAway (in the main compile) and the formatter check. The decoder tests make images
      # on JavaFX's headless platform, so no display is needed. The build downloads the codec
      # bundle (pom.xml, codecs-*), and its tests must run rather than skip, on every platform.
      - name: Verify
        env:
          MIRADA_REQUIRE_CODECS: '1'
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        # Only the failures matter here, and only then.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

  # What ships: the native image (GraalVM + StaticFX, docs/native-image.md) in jpackage's app image
  # wherever GraalVM builds one, and the jlink image with its AOT cache on Intel macOS, which
  # GraalVM 25.4 no longer targets. A native image is only as complete as its reachability
  # metadata, and a gap shows only when a file that needs it is opened, so every variant of every
  # format is opened in each. A failure there usually means scripts/native-metadata.sh needs
  # running again.
  package:
    name: Package (${{ matrix.target }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned as in release.yml: the native image takes the build host's glibc symbol versions.
          - { os: ubuntu-24.04,   target: linux-x64,   build: native }
          - { os: macos-latest,   target: macos-arm64, build: native }
          - { os: windows-latest, target: windows-x64, build: native }
          - { os: macos-15-intel, target: macos-x64,   build: jlink }

    steps:
      - uses: actions/checkout@v5

      # Oracle GraalVM, the distribution StaticFX is confirmed with. 25.4, not the 25.0 LTS: 25.0
      # has no AWT on macOS, so ImageIO (WebP, TIFF, PSD) fails there.
      - name: Set up Oracle GraalVM 25.4
        if: matrix.build == 'native'
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          version: '25.4'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        if: matrix.build == 'jlink'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # StaticFX links JavaFX statically, so on Linux the GTK, X and GL development libraries are
      # needed to link (macOS and Windows link against their own); a display for the smoke tests;
      # rpmbuild and the rest for the Linux installers and their checks.
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev libgtk-3-dev libxtst-dev \
            libxxf86vm-dev libgl1-mesa-dev xvfb fakeroot rpm cpio desktop-file-utils

      # jpackage cannot cross-build, so each platform proves its own image. Linux and macOS build
      # their installers too (the deb's contents get checked below); the msi, which needs WiX, is
      # left to the release. The native build takes a few minutes and several GB of memory.
      - name: App image
        env:
          MIRADA_REQUIRE_AOT: ${{ matrix.build == 'jlink' && '1' || '' }}
        run: |
          profiles=dist
          [ "${{ matrix.build }}" = native ] && profiles=dist,native
          installers=true
          [ "${{ runner.os }}" != Windows ] && installers=false
          ./mvnw -B --no-transfer-progress clean -P$profiles -DskipTests -Dskip.installers=$installers package

      - name: Smoke test (every format and variant, in the packaged app)
        run: |
          case "${{ runner.os }}" in
            macOS)   launcher=target/dist/Mirada.app/Contents/MacOS/Mirada ;;
            Windows) launcher=target/dist/Mirada/Mirada.exe ;;
            *)       launcher=target/dist/Mirada/bin/Mirada ;;
          esac
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/image
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/matrix
          # As Finder opens a file: an Apple Event, not an argument.
          if [ "${{ runner.os }}" = macOS ]; then
            bash scripts/smoke-test.sh target/dist/Mirada.app src/test/resources/com/mirada/image
          fi

      - name: Check the macOS signature and disk image
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 target/dist/Mirada.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0" target/dist/Mirada.app/Contents/Info.plist
          hdiutil verify target/installers/*.dmg

      # Cold runs on a shared virtual machine: a sanity figure, not a benchmark (docs/native-image.md
      # has the real numbers).
      - name: Start-up (for information)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            run=(xvfb-run -a); launcher=target/dist/Mirada/bin/Mirada
          else
            run=(); launcher=target/dist/Mirada.app/Contents/MacOS/Mirada
          fi
          "${run[@]}" scripts/measure-startup.sh -n 5 "$launcher" src/test/resources/com/mirada/image/red-blue.jpg

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh target/installers branding/mirada.png

      - name: Install the deb and smoke-test it
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./$(ls target/installers/*.deb)"
          bash scripts/smoke-test.sh /opt/mirada/bin/Mirada src/test/resources/com/mirada/image

      # A week's worth of the app as built, to try on a machine CI does not have.
      - name: Upload the app image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirada-${{ matrix.target }}
          path: target/dist/
          retention-days: 7
          if-no-files-found: warn
