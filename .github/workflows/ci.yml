# Build and test on all three platforms.
#
# Mirada is meant to be cross-platform, and only Linux has ever run it. This is where Windows and
# macOS compile and test it on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

# Read-only: nothing here publishes.
permissions:
  contents: read

concurrency:
  # A newer push supersedes an older one on the same branch; nothing is learned from finishing a run
  # against code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The native codecs the HEIC, AVIF and JPEG XL tests decode with. Windows has no package
      # manager copy worth trusting here, so its tests skip until the installers bundle them.
      - name: Install libheif and libjxl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libheif1 libheif-plugin-libde265 libheif-plugin-dav1d libjxl0.7

      - name: Install libheif and libjxl (macOS)
        if: runner.os == 'macOS'
        run: brew install libheif jpeg-xl

      # Tests, NullAway (in the main compile) and the formatter check. The decoder tests make images
      # on JavaFX's headless platform, so no display is needed. Where the codecs were installed
      # above, their tests must run rather than skip.
      - name: Verify
        env:
          MIRADA_REQUIRE_CODECS: ${{ runner.os != 'Windows' && '1' || '' }}
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        # Only the failures matter here, and only then.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7
