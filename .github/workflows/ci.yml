# Build and test on all three platforms (Pauta REL-19).
#
# Mirada is meant to be cross-platform, and only Linux has ever run it. This is where Windows and
# macOS compile and test it on every push to main and every pull request, into any branch.
#
# Format and Build & Test are the checks main's branch protection requires: "Format",
# "Build & Test (ubuntu-latest)", "Build & Test (macos-latest)" and "Build & Test (windows-latest)".
# Renaming a job renames its check, and main then waits for one that never comes: change the rule
# with it. workflow_dispatch is how the release's bump job runs them on its pull request's branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

# Read-only: nothing here publishes.
permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes the older one; nothing is learned from finishing a run
  # against code that has already been replaced. Runs on main always finish (REL-26, Pauta 4.0.1):
  # each one is the record of a commit that landed.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting on its own, so a check that fails says which thing is wrong.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Palantir, as `./mvnw spotless:apply` writes it.
      - name: Check formatting
        run: ./mvnw -B --no-transfer-progress spotless:check

  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests and NullAway (in the main compile); the formatter is the Format job's. The decoder
      # tests make images on JavaFX's headless platform, so no display is needed. The build
      # downloads the codec bundle (pom.xml, codecs-*), and its tests must run rather than skip, on
      # every platform.
      - name: Verify
        env:
          MIRADA_REQUIRE_CODECS: '1'
        run: ./mvnw -B --no-transfer-progress -Dspotless.check.skip=true verify

      - name: Upload test reports
        # Always, pass or fail (REL-27): a passing run's reports say what ran and how long it took.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

      # Verify's coverage gate (PLAT-12) reads target/jacoco.exec; the report is written after the
      # tests, so it is there to keep and to sum up even when the floors failed the build.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-${{ matrix.os }}
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarise coverage
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then
            echo "### Coverage (${{ matrix.os }}): no report (the tests did not run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 { lm += $8; lc += $9; mm += $12; mc += $13; bm += $6; bc += $7 }
            END {
              print "### Coverage (" os ")"
              printf "Lines %.1f%% · methods %.1f%% · branches %.1f%%\n", 100 * lc / (lc + lm), 100 * mc / (mc + mm), 100 * bc / (bc + bm)
            }' os="${{ matrix.os }}" "$csv" >> "$GITHUB_STEP_SUMMARY"

  # What ships: the native image (GraalVM + StaticFX, docs/native-image.md) in jpackage's app image
  # wherever GraalVM builds one, and the jlink image with its AOT cache on Intel macOS, which
  # GraalVM 25.4 no longer targets. A native image is only as complete as its reachability
  # metadata, and a gap shows only when a file that needs it is opened, so every variant of every
  # format is opened in each. A failure there usually means scripts/native-metadata.sh needs
  # running again.
  package:
    name: Package (${{ matrix.target }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned as in release.yml: the native image takes the build host's glibc symbol versions.
          - { os: ubuntu-24.04,   target: linux-x64,   build: native }
          - { os: macos-latest,   target: macos-arm64, build: native }
          - { os: windows-latest, target: windows-x64, build: native }
          - { os: macos-15-intel, target: macos-x64,   build: jlink }

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Oracle GraalVM, the distribution StaticFX is confirmed with. 25.4, not the 25.0 LTS: 25.0
      # has no AWT on macOS, so ImageIO (WebP, TIFF, PSD) fails there.
      - name: Set up Oracle GraalVM 25.4
        if: matrix.build == 'native'
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm
          version: '25.4'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        if: matrix.build == 'jlink'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # StaticFX links JavaFX statically, so on Linux the GTK, X and GL development libraries are
      # needed to link (macOS and Windows link against their own); a display for the smoke tests;
      # rpmbuild and the rest for the Linux installers and their checks.
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev libgtk-3-dev libxtst-dev \
            libxxf86vm-dev libgl1-mesa-dev xvfb fakeroot rpm cpio desktop-file-utils appstream

      # jpackage cannot cross-build, so each platform proves its own image. Linux and macOS build
      # their installers too (the deb's contents get checked below); the msi, which needs WiX, is
      # left to the release. The native build takes a few minutes and several GB of memory.
      - name: App image
        env:
          MIRADA_REQUIRE_AOT: ${{ matrix.build == 'jlink' && '1' || '' }}
        run: |
          profiles=dist
          [ "${{ matrix.build }}" = native ] && profiles=dist,native
          installers=true
          [ "${{ runner.os }}" != Windows ] && installers=false
          ./mvnw -B --no-transfer-progress clean -P$profiles -DskipTests -Dskip.installers=$installers package

      - name: Smoke test (every format and variant, in the packaged app)
        run: |
          case "${{ runner.os }}" in
            macOS)   launcher=target/dist/Mirada.app/Contents/MacOS/Mirada ;;
            Windows) launcher=target/dist/Mirada/Mirada.exe ;;
            *)       launcher=target/dist/Mirada/bin/Mirada ;;
          esac
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/image
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/matrix
          # As Finder opens a file: an Apple Event, not an argument.
          if [ "${{ runner.os }}" = macOS ]; then
            bash scripts/smoke-test.sh target/dist/Mirada.app src/test/resources/com/mirada/image
          fi

      - name: Check the macOS signature and disk image
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 target/dist/Mirada.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0" target/dist/Mirada.app/Contents/Info.plist
          hdiutil verify target/installers/*.dmg

      # Cold runs on a shared virtual machine: a sanity figure, not a benchmark (docs/native-image.md
      # has the real numbers).
      - name: Start-up (for information)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            run=(xvfb-run -a); launcher=target/dist/Mirada/bin/Mirada
          else
            run=(); launcher=target/dist/Mirada.app/Contents/MacOS/Mirada
          fi
          "${run[@]}" scripts/measure-startup.sh -n 5 "$launcher" src/test/resources/com/mirada/image/red-blue.jpg

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh target/installers branding/mirada.png

      - name: Install the deb and smoke-test it
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./$(ls target/installers/*.deb)"
          bash scripts/smoke-test.sh /opt/mirada/bin/Mirada src/test/resources/com/mirada/image

      # The AppImage as a user runs it. GitHub's runners have no FUSE to mount it, so the runtime
      # unpacks it first, which runs the same tree.
      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/smoke-test.sh "$(ls target/installers/*.AppImage)" src/test/resources/com/mirada/image

      # A week's worth of the app as built, to try on a machine CI does not have.
      - name: Upload the app image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirada-${{ matrix.target }}
          path: target/dist/
          retention-days: 7
          if-no-files-found: warn
