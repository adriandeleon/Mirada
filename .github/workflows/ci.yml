# Build and test on all three platforms.
#
# Mirada is meant to be cross-platform, and only Linux has ever run it. This is where Windows and
# macOS compile and test it on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

# Read-only: nothing here publishes.
permissions:
  contents: read

concurrency:
  # A newer push supersedes an older one on the same branch; nothing is learned from finishing a run
  # against code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests, NullAway (in the main compile) and the formatter check. The decoder tests make images
      # on JavaFX's headless platform, so no display is needed. The build downloads the codec
      # bundle (pom.xml, codecs-*), and its tests must run rather than skip, on every platform.
      - name: Verify
        env:
          MIRADA_REQUIRE_CODECS: '1'
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        # Only the failures matter here, and only then.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # A display for the AOT training run and the smoke tests, which must render; rpmbuild and the
      # rest for the Linux installers and their checks.
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fakeroot rpm cpio desktop-file-utils

      # jlink and jpackage cannot cross-build, so each platform proves its own image. A missing AOT
      # cache fails here rather than quietly costing half of start-up in whatever ships next. Linux
      # builds the installers too, because that is where their contents get checked; the dmg and
      # msi are left to the release.
      - name: App image
        env:
          MIRADA_REQUIRE_AOT: '1'
        run: |
          installers=true
          [ "${{ runner.os }}" = Linux ] && installers=false
          ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests -Dskip.installers=$installers package

      - name: Smoke test (every format, in the packaged app)
        run: |
          case "${{ runner.os }}" in
            macOS)   launcher=target/dist/Mirada.app/Contents/MacOS/Mirada ;;
            Windows) launcher=target/dist/Mirada/Mirada.exe ;;
            *)       launcher=target/dist/Mirada/bin/Mirada ;;
          esac
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/image
          # Every variant of every format (scripts/make-format-matrix.sh), on each platform's own
          # packaged runtime and codecs.
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/matrix

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 target/dist/Mirada.app

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh target/installers branding/mirada.png

      - name: Install the deb and smoke-test it
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./$(ls target/installers/*.deb)"
          bash scripts/smoke-test.sh /opt/mirada/bin/Mirada src/test/resources/com/mirada/image

  # Mirada as a GraalVM native image with JavaFX linked in by StaticFX (docs/native-image.md): an
  # experiment, not a release. It starts in half the time of the jlink image, but it is only as
  # complete as its reachability metadata, and a gap shows only when a file that needs it is opened.
  # So this builds it and opens every variant of every format in it. A failure here usually means
  # scripts/native-metadata.sh needs running again.
  native:
    name: Native image (${{ matrix.target }}, StaticFX)
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64

    steps:
      - uses: actions/checkout@v5

      # Oracle GraalVM, the distribution StaticFX is confirmed with. 25.4, not the 25.0 LTS: 25.0
      # has no AWT on macOS, so ImageIO (WebP, TIFF, PSD) fails there.
      - name: Set up Oracle GraalVM 25.4
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          version: '25.4'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # StaticFX links JavaFX statically, so on Linux the GTK, X and GL development libraries are
      # needed to link; xvfb for the smoke test. macOS links against its own frameworks.
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev libgtk-3-dev libxtst-dev \
            libxxf86vm-dev libgl1-mesa-dev xvfb

      - name: GraalVM
        run: native-image --version

      # A few minutes and several GB of memory.
      - name: Native image
        run: |
          ./mvnw -B --no-transfer-progress -Pnative -Denforcer.skip -DskipTests package
          ls -l target/mirada target/*.so target/*.dylib 2>/dev/null || true

      # The codec bundle the build downloaded is target/codecs, beside target/mirada, which is
      # where a native image looks for it.
      - name: Smoke test (every format and variant, in the native image)
        run: |
          bash scripts/smoke-test.sh target/mirada src/test/resources/com/mirada/image
          bash scripts/smoke-test.sh target/mirada src/test/resources/com/mirada/matrix

      # Cold runs on a shared virtual machine: a sanity figure, not a benchmark (docs/native-image.md
      # has the real numbers).
      - name: Start-up (for information)
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = Linux ]; then run=(xvfb-run -a); else run=(); fi
          "${run[@]}" scripts/measure-startup.sh -n 5 target/mirada src/test/resources/com/mirada/image/red-blue.jpg

      - name: Upload the native app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirada-native-${{ matrix.target }}
          path: |
            target/mirada
            target/*.so
            target/*.dylib
            target/codecs/
          retention-days: 7
          if-no-files-found: warn
