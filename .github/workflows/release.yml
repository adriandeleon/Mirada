# Builds the installers on every platform and publishes them as a GitHub release.
#
# Triggered by a v* tag. The pom's version is the single source of truth: the tag has to agree with
# it, and a snapshot is refused — artifacts labelled with a version they were not built from are
# worse than none. Run by hand (workflow_dispatch) it is a dry run: everything is built and checked
# and uploaded as workflow artifacts, and no release is made.
#
# Termina's release.yml, without what Mirada does not have yet: Developer ID signing and
# notarization, Linux package signing, the AppImage, and the Homebrew and winget packagers. The
# macOS and Windows installers are therefore unsigned (README, "Installing it").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build jobs run Maven and execute what it resolves, so none of them holds
# a token that can write. Only the publish job asks for more.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          pom=$(./mvnw -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          public="${pom%-SNAPSHOT}"
          echo "version=$public" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$public" ]; then
              echo "::error::tag v$tag does not match the pom version $pom"
              exit 1
            fi
            if [ "$pom" != "$public" ]; then
              echo "::error::refusing to release a snapshot ($pom); drop -SNAPSHOT from pom.xml"
              exit 1
            fi
          fi
          echo "Building $public for ${{ matrix.target }}"

      # jpackage shells out to each platform's packaging tools, which a fresh runner may lack.
      - name: Installer prerequisites
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              # rpmbuild for the rpm, xvfb for AOT training and the smoke tests, the rest for the
              # package checks.
              sudo apt-get update -qq
              sudo apt-get install -y -qq fakeroot rpm cpio xvfb desktop-file-utils
              ;;
            Windows)
              # jpackage makes the MSI through WiX. Pinned, as Termina's: the path names 3.14.
              choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
              echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
              ;;
          esac

      # With the tests: a tag is not gated on CI having passed, and two of these runners
      # (linux-arm64, macos-x64) run nowhere else, so this is the only place their build is tested.
      - name: Build, test and package
        env:
          MIRADA_REQUIRE_AOT: '1'
          MIRADA_REQUIRE_CODECS: '1'
        run: ./mvnw -B --no-transfer-progress clean -Pdist -Dskip.installers=false verify

      - name: Smoke-test the app image (every format)
        run: |
          case "${{ runner.os }}" in
            macOS)   launcher=target/dist/Mirada.app/Contents/MacOS/Mirada ;;
            Windows) launcher=target/dist/Mirada/Mirada.exe ;;
            *)       launcher=target/dist/Mirada/bin/Mirada ;;
          esac
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/image

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 target/dist/Mirada.app

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh target/installers branding/mirada.png

      # The deb as a user gets it: installed by apt, which resolves its dependencies, and run from
      # /opt. The app image's smoke test never reaches the package's own layout.
      - name: Install the deb and smoke-test it
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./$(ls target/installers/*.deb)"
          bash scripts/smoke-test.sh /opt/mirada/bin/Mirada src/test/resources/com/mirada/image

      # One naming scheme across five targets, so the release page is legible: jpackage names its
      # output after the bundle version (1.x on macOS for a 0.x release) and no target.
      - name: Name the installers
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd target/installers
          shopt -s nullglob
          produced=0
          for file in *; do
            case "$file" in
              *.tar.gz) ext=tar.gz ;;
              *)        ext="${file##*.}" ;;
            esac
            mv -v "$file" "Mirada-$version-${{ matrix.target }}.$ext"
            produced=$((produced + 1))
          done
          [ "$produced" -gt 0 ] || { echo "::error::no installer was produced for ${{ matrix.target }}"; exit 1; }
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mirada-${{ matrix.target }}
          path: target/installers/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    # Only a tag publishes; a manual run stops after the builds.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum Mirada-* | tee SHA256SUMS

      # A signed statement, kept by GitHub, that each file was built by this workflow from this
      # commit: `gh attestation verify <file> --repo adriandeleon/Mirada` checks a download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/Mirada-*'

      # The notes are this version's section of CHANGELOG.md, so the release says what the changelog
      # says. A version with no section is refused rather than released with empty notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "v$VERSION" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Mirada $VERSION" \
            --notes-file notes.md \
            --verify-tag
