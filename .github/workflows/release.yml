# Builds the installers on every platform and publishes them as a GitHub release.
#
# Triggered by a v* tag. The pom's version is the single source of truth: the tag has to agree with
# it, and a snapshot is refused — artifacts labelled with a version they were not built from are
# worse than none. Run by hand (workflow_dispatch) it is a dry run: everything is built and checked
# and uploaded as workflow artifacts, and no release is made.
#
# Signing (scripts/ci-signing-credentials.sh): with the repository's secrets, macOS builds are signed
# with the Developer ID and notarized, and the Linux packages and the checksums with the release GPG
# key. A run by hand without them signs with throwaway credentials made on the runner, so a dry run
# checks every signing step; a tag without them builds unsigned. Windows is not signed yet.
#
# Once published, the winget workflow writes the manifests from the released MSI, installs from them
# and uploads them, ready for a pull request to microsoft/winget-pkgs. Not here yet: the AppImage
# and the Homebrew cask (which Homebrew takes only once the app is notarized).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build jobs run Maven and execute what it resolves, so none of them holds
# a token that can write. Only the publish job asks for more.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # The native image (GraalVM + StaticFX) wherever GraalVM 25.4 builds one; Intel macOS, which
        # it no longer targets, gets the jlink image with its AOT cache.
        include:
          - { os: ubuntu-latest,    target: linux-x64,   build: native }
          - { os: ubuntu-24.04-arm, target: linux-arm64, build: native }
          - { os: macos-latest,     target: macos-arm64, build: native }
          - { os: macos-15-intel,   target: macos-x64,   build: jlink }
          - { os: windows-latest,   target: windows-x64, build: native }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # 25.4, not the 25.0 LTS: 25.0 has no AWT on macOS (docs/native-image.md).
      - name: Set up Oracle GraalVM 25.4
        if: matrix.build == 'native'
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          version: '25.4'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        if: matrix.build == 'jlink'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          pom=$(./mvnw -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          public="${pom%-SNAPSHOT}"
          echo "version=$public" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$public" ]; then
              echo "::error::tag v$tag does not match the pom version $pom"
              exit 1
            fi
            if [ "$pom" != "$public" ]; then
              echo "::error::refusing to release a snapshot ($pom); drop -SNAPSHOT from pom.xml"
              exit 1
            fi
          fi
          echo "Building $public for ${{ matrix.target }}"

      # jpackage shells out to each platform's packaging tools, which a fresh runner may lack.
      - name: Installer prerequisites
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              # The GTK, X and GL development libraries to link the native image, rpmbuild for the
              # rpm, xvfb for the smoke tests, the rest for the package checks.
              sudo apt-get update -qq
              sudo apt-get install -y -qq build-essential zlib1g-dev libgtk-3-dev libxtst-dev \
                libxxf86vm-dev libgl1-mesa-dev fakeroot rpm cpio xvfb desktop-file-utils
              ;;
            Windows)
              # jpackage makes the MSI through WiX. Pinned, as Termina's: the path names 3.14.
              choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
              echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
              ;;
          esac

      - name: Signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: bash scripts/ci-signing-credentials.sh

      # With the tests: a tag is not gated on CI having passed, and two of these runners
      # (linux-arm64, macos-x64) run nowhere else, so this is the only place their build is tested.
      - name: Build, test and package
        env:
          MIRADA_REQUIRE_AOT: ${{ matrix.build == 'jlink' && '1' || '' }}
          MIRADA_REQUIRE_CODECS: '1'
        run: |
          profiles=dist
          [ "${{ matrix.build }}" = native ] && profiles=dist,native
          ./mvnw -B --no-transfer-progress clean -P$profiles -Dskip.installers=false verify

      - name: Smoke-test the app image (every format)
        run: |
          case "${{ runner.os }}" in
            macOS)   launcher=target/dist/Mirada.app/Contents/MacOS/Mirada ;;
            Windows) launcher=target/dist/Mirada/Mirada.exe ;;
            *)       launcher=target/dist/Mirada/bin/Mirada ;;
          esac
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/image
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/matrix
          # As Finder opens a file: an Apple Event, not an argument.
          if [ "${{ runner.os }}" = macOS ]; then
            bash scripts/smoke-test.sh target/dist/Mirada.app src/test/resources/com/mirada/image
          fi

      # An msi larger than the files it installs stores something twice: jpackage put the whole
      # native launcher in as the Add/Remove Programs icon until build-installers.sh pointed it at
      # the .ico. Installed for this user, silently, it must then open every format as the app
      # image did.
      - name: Check and install the msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-Item target/installers/*.msi).FullName
          $size = (Get-Item $msi).Length
          $image = (Get-ChildItem -Recurse -File target/dist/Mirada | Measure-Object Length -Sum).Sum
          '{0}: {1:N1} MB, installing {2:N1} MB' -f (Split-Path -Leaf $msi), ($size / 1MB), ($image / 1MB)
          if ($size -ge $image) { throw 'the msi is larger than the app it installs' }

          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $run = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec exited with $($run.ExitCode)" }
          $installed = @("$env:LOCALAPPDATA\Mirada", "$env:LOCALAPPDATA\Programs\Mirada", "$env:ProgramFiles\Mirada") |
              ForEach-Object { Join-Path $_ 'Mirada.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installed) { Get-Content $log -Tail 80; throw 'installed, but no Mirada.exe where jpackage installs' }
          "installed: $installed"
          "MIRADA_INSTALLED=$installed" >> $env:GITHUB_ENV

          # The icon Add/Remove Programs shows is the .ico, not a 78 MB copy of the program. A
          # per-user MSI keeps its entry under Windows Installer's UserData, not in Uninstall.
          $keys = @(Get-ChildItem -ErrorAction SilentlyContinue HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall,
                  HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall) +
              @(Get-Item -ErrorAction SilentlyContinue HKLM:\Software\Microsoft\Windows\CurrentVersion\Installer\UserData\*\Products\*\InstallProperties)
          $entry = $keys | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'Mirada' } | Select-Object -First 1
          if (-not $entry) { throw 'no Add/Remove Programs entry for Mirada' }
          # An MSI's ARPPRODUCTICON lands as ProductIcon under Installer\Products, cached as a file.
          $product = Get-ChildItem -ErrorAction SilentlyContinue HKCU:\Software\Microsoft\Installer\Products,
                  HKLM:\Software\Classes\Installer\Products |
              Get-ItemProperty | Where-Object { $_.ProductName -eq 'Mirada' } | Select-Object -First 1
          $iconFile = @($product.ProductIcon, $entry.DisplayIcon) | Where-Object { $_ } | Select-Object -First 1
          "Add/Remove Programs: $($entry.DisplayName) $($entry.DisplayVersion), icon $iconFile"
          $iconFile = "$iconFile" -replace ',-?\d+$', ''
          if (-not $iconFile -or -not (Test-Path $iconFile)) {
              $entry | Format-List | Out-String; $product | Format-List | Out-String
              throw "no icon file for the entry"
          }
          $icon = (Get-Item $iconFile).Length
          if ($icon -ne (Get-Item branding/mirada.ico).Length) { throw "the icon is $icon bytes, not mirada.ico" }

      - name: Smoke-test the installed msi
        if: runner.os == 'Windows'
        run: bash scripts/smoke-test.sh "$(cygpath -u "$MIRADA_INSTALLED")" src/test/resources/com/mirada/image

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 target/dist/Mirada.app
          codesign --display --verbose=2 target/dist/Mirada.app 2>&1 | grep -E 'Authority|Signature|flags'
          if [ -n "${MIRADA_MAC_IDENTITY:-}" ]; then
            # Signed by the identity, with the hardened runtime notarization requires.
            codesign --display --verbose=2 target/dist/Mirada.app 2>&1 | grep -q "Authority=$MIRADA_MAC_IDENTITY"
            codesign --display --verbose=2 target/dist/Mirada.app 2>&1 | grep -q 'runtime'
          fi

      # Notarized when the Apple account is in the secrets; signed only, on a dry run.
      - name: Sign and notarize the dmg
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/notarize-mac.sh target/installers/*.dmg

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh target/installers branding/mirada.png

      # The deb as a user gets it: installed by apt, which resolves its dependencies, and run from
      # /opt. The app image's smoke test never reaches the package's own layout.
      - name: Install the deb and smoke-test it
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./$(ls target/installers/*.deb)"
          bash scripts/smoke-test.sh /opt/mirada/bin/Mirada src/test/resources/com/mirada/image

      # One naming scheme across five targets, so the release page is legible: jpackage names its
      # output after the bundle version (1.x on macOS for a 0.x release) and no target.
      - name: Name the installers
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd target/installers
          shopt -s nullglob
          produced=0
          for file in *; do
            case "$file" in
              *.asc) continue ;;
              *.tar.gz) ext=tar.gz ;;
              *)        ext="${file##*.}" ;;
            esac
            mv -v "$file" "Mirada-$version-${{ matrix.target }}.$ext"
            produced=$((produced + 1))
          done
          [ "$produced" -gt 0 ] || { echo "::error::no installer was produced for ${{ matrix.target }}"; exit 1; }
          ls -la

      # After naming, so each signature is named for its file. rpm -K checks the rpm's own
      # signature against the key, in a database of its own.
      - name: Sign the Linux packages
        if: runner.os == 'Linux' && env.MIRADA_GPG_KEY != ''
        run: |
          set -euo pipefail
          bash scripts/sign-linux.sh target/installers "$MIRADA_GPG_KEY"
          db="$(mktemp -d)"
          gpg --armor --export "$MIRADA_GPG_KEY" > "$RUNNER_TEMP/public.asc"
          rpm --dbpath "$db" --initdb
          rpm --dbpath "$db" --import "$RUNNER_TEMP/public.asc"
          rpm --dbpath "$db" -Kv target/installers/*.rpm
          checked="$(rpm --dbpath "$db" -K target/installers/*.rpm)"
          echo "$checked"
          echo "$checked" | grep -q 'signatures OK'
          ! echo "$checked" | grep -q 'NOT OK'
          for asc in target/installers/*.asc; do gpg --batch --verify "$asc" "${asc%.asc}"; done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mirada-${{ matrix.target }}
          path: target/installers/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    # Only a tag publishes; a manual run stops after the builds.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum Mirada-* | tee SHA256SUMS

      # The checksums signed with the release key, and the public key beside them, when the key is in
      # the secrets: verifying SHA256SUMS.asc and then the checksums covers every file.
      - name: Sign the checksums
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then echo "no release key: checksums unsigned"; exit 0; fi
          GITHUB_EVENT_NAME=push bash scripts/ci-signing-credentials.sh
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          cd artifacts
          gpg --batch --local-user "$key" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --armor --export "$key" > mirada-signing-key.asc

      # A signed statement, kept by GitHub, that each file was built by this workflow from this
      # commit: `gh attestation verify <file> --repo adriandeleon/Mirada` checks a download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/Mirada-*'

      # The notes are this version's section of CHANGELOG.md, so the release says what the changelog
      # says. A version with no section is refused rather than released with empty notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "v$VERSION" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Mirada $VERSION" \
            --notes-file notes.md \
            --verify-tag

  winget:
    name: winget
    needs: [build, release]
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.build.outputs.version }}
