# Builds, signs and publishes a release (Pauta REL-21). AGENTS.md, "Releasing", has the steps and
# the secrets.
#
#   push a tag vX.Y.Z   the release: the tag must equal the pom version, then the five-target matrix
#                       (each leg tests, packages, smoke-tests and, on macOS, signs, notarizes and
#                       launches the dmg), sign-linux, the release-asset check, build provenance,
#                       JReleaser creating the release, the winget manifests, and a pull request that
#                       reopens main at the next -SNAPSHOT.
#   workflow_dispatch   a dry run: the same jobs up to JReleaser with --dry-run, which renders the
#                       release and publishes nothing; no winget, no bump. Without the secrets it
#                       signs with throwaway credentials made on the runner (a self-signed macOS
#                       identity, a GPG key), so every signing step and its checks still run.
#
# A tag without the signing secrets fails (REL-28): the Developer ID and notarization key in the
# build legs (scripts/ci-signing-credentials.sh), the release key in sign-linux and publish. A
# release is immutable once published, and an unsigned one is what this exists to stop. Windows is
# not signed yet (REL-17, an open decision).
#
# ReleaseSupplyChainTest reads this file: it fails when a signing, notarization or attestation step
# moves or goes, and keeps the attested files the ones JReleaser attaches.
name: Release

# Version-shaped tags only: everything below takes the tag for a version.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

# Read-only by default: the build legs run Maven and execute what it resolves, so none of them holds
# a token that can write. Only publish (the release, attestations) and bump (the pull request) ask
# for more, in their own blocks.
permissions:
  contents: read

jobs:
  # The pom is the single source of truth (REL-05). A tag that disagrees with it, or a snapshot,
  # fails here in seconds, before five legs start. A dry run from a -SNAPSHOT pom names its files
  # with the plain version: JReleaser refuses a snapshot for an immutable release even with
  # --dry-run. The app inside keeps its -SNAPSHOT.
  preflight:
    name: Preflight (tag vs pom version)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve and check the version
        id: version
        run: |
          set -euo pipefail
          pom=$(./mvnw -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          public="${pom%-SNAPSHOT}"
          echo "version=$public" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pom" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the pom version $pom. Set <version> to $tag and re-tag."
              exit 1
            fi
            case "$pom" in *-SNAPSHOT)
              echo "::error::refusing to release a snapshot ($pom); drop -SNAPSHOT from pom.xml"; exit 1 ;;
            esac
            [[ "$pom" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
              { echo "::error::$pom is not a version (X.Y.Z or X.Y.Z-suffix)"; exit 1; }
          fi
          echo "Releasing $public (${GITHUB_REF_TYPE}: ${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # The native image (GraalVM + StaticFX) wherever GraalVM 25.4 builds one; Intel macOS, which
        # it no longer targets, gets the jlink image with its AOT cache.
        # Linux is pinned, never ubuntu-latest: the native image takes the build host's newest glibc
        # symbol versions, and 26.04's made 0.2.0 and 0.2.1 need glibc 2.43 (check-linux-packages.sh
        # now refuses anything above Ubuntu 22.04's 2.35).
        include:
          - { os: ubuntu-24.04,     target: linux-x64,   build: native }
          - { os: ubuntu-24.04-arm, target: linux-arm64, build: native }
          - { os: macos-latest,     target: macos-arm64, build: native }
          - { os: macos-15-intel,   target: macos-x64,   build: jlink }
          - { os: windows-latest,   target: windows-x64, build: native }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 25.4, not the 25.0 LTS: 25.0 has no AWT on macOS (docs/native-image.md).
      - name: Set up Oracle GraalVM 25.4
        if: matrix.build == 'native'
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm
          version: '25.4'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        if: matrix.build == 'jlink'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jpackage shells out to each platform's packaging tools, which a fresh runner may lack.
      - name: Installer prerequisites
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              # The GTK, X and GL development libraries to link the native image, rpmbuild for the
              # rpm, xvfb for the smoke tests, the rest for the package checks.
              sudo apt-get update -qq
              sudo apt-get install -y -qq build-essential zlib1g-dev libgtk-3-dev libxtst-dev \
                libxxf86vm-dev libgl1-mesa-dev fakeroot rpm cpio xvfb desktop-file-utils appstream
              ;;
            Windows)
              # jpackage makes the MSI through WiX. Pinned, as Termina's: the path names 3.14.
              choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
              echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
              ;;
          esac

      # The Developer ID goes into a throwaway keychain before -Pdist, whose last image step
      # (fix-mac-bundle.sh, sign-mac.sh) signs the bundle with it. A tag without all four secrets
      # fails here; any other run signs with a self-signed identity and skips notarizing.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: bash scripts/ci-signing-credentials.sh

      # With the tests: a tag is not gated on CI having passed, and two of these runners
      # (linux-arm64, macos-x64) run nowhere else, so this is the only place their build is tested.
      - name: Build, test and package
        env:
          MIRADA_REQUIRE_AOT: ${{ matrix.build == 'jlink' && '1' || '' }}
          MIRADA_REQUIRE_CODECS: '1'
        run: |
          profiles=dist
          [ "${{ matrix.build }}" = native ] && profiles=dist,native
          ./mvnw -B --no-transfer-progress clean -P$profiles -Dskip.installers=false verify

      - name: Smoke-test the app image (every format)
        run: |
          case "${{ runner.os }}" in
            macOS)   launcher=target/dist/Mirada.app/Contents/MacOS/Mirada ;;
            Windows) launcher=target/dist/Mirada/Mirada.exe ;;
            *)       launcher=target/dist/Mirada/bin/Mirada ;;
          esac
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/image
          bash scripts/smoke-test.sh "$launcher" src/test/resources/com/mirada/matrix
          # As Finder opens a file: an Apple Event, not an argument.
          if [ "${{ runner.os }}" = macOS ]; then
            bash scripts/smoke-test.sh target/dist/Mirada.app src/test/resources/com/mirada/image
          fi

      # An msi larger than the files it installs stores something twice: jpackage put the whole
      # native launcher in as the Add/Remove Programs icon until build-installers.sh pointed it at
      # the .ico. Installed for this user, silently, it must then open every format as the app
      # image did.
      - name: Check and install the msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-Item target/installers/*.msi).FullName
          $size = (Get-Item $msi).Length
          $image = (Get-ChildItem -Recurse -File target/dist/Mirada | Measure-Object Length -Sum).Sum
          '{0}: {1:N1} MB, installing {2:N1} MB' -f (Split-Path -Leaf $msi), ($size / 1MB), ($image / 1MB)
          if ($size -ge $image) { throw 'the msi is larger than the app it installs' }

          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $run = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec exited with $($run.ExitCode)" }
          $installed = @("$env:LOCALAPPDATA\Mirada", "$env:LOCALAPPDATA\Programs\Mirada", "$env:ProgramFiles\Mirada") |
              ForEach-Object { Join-Path $_ 'Mirada.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installed) { Get-Content $log -Tail 80; throw 'installed, but no Mirada.exe where jpackage installs' }
          "installed: $installed"
          "MIRADA_INSTALLED=$installed" >> $env:GITHUB_ENV

          # The icon Add/Remove Programs shows is the .ico, not a 78 MB copy of the program. A
          # per-user MSI keeps its entry under Windows Installer's UserData, not in Uninstall.
          $keys = @(Get-ChildItem -ErrorAction SilentlyContinue HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall,
                  HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall) +
              @(Get-Item -ErrorAction SilentlyContinue HKLM:\Software\Microsoft\Windows\CurrentVersion\Installer\UserData\*\Products\*\InstallProperties)
          $entry = $keys | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'Mirada' } | Select-Object -First 1
          if (-not $entry) { throw 'no Add/Remove Programs entry for Mirada' }
          # An MSI's ARPPRODUCTICON lands as ProductIcon under Installer\Products, cached as a file.
          $product = Get-ChildItem -ErrorAction SilentlyContinue HKCU:\Software\Microsoft\Installer\Products,
                  HKLM:\Software\Classes\Installer\Products |
              Get-ItemProperty | Where-Object { $_.ProductName -eq 'Mirada' } | Select-Object -First 1
          $iconFile = @($product.ProductIcon, $entry.DisplayIcon) | Where-Object { $_ } | Select-Object -First 1
          "Add/Remove Programs: $($entry.DisplayName) $($entry.DisplayVersion), icon $iconFile"
          $iconFile = "$iconFile" -replace ',-?\d+$', ''
          if (-not $iconFile -or -not (Test-Path $iconFile)) {
              $entry | Format-List | Out-String; $product | Format-List | Out-String
              throw "no icon file for the entry"
          }
          $icon = (Get-Item $iconFile).Length
          if ($icon -ne (Get-Item branding/mirada.ico).Length) { throw "the icon is $icon bytes, not mirada.ico" }

      - name: Smoke-test the installed msi
        if: runner.os == 'Windows'
        run: bash scripts/smoke-test.sh "$(cygpath -u "$MIRADA_INSTALLED")" src/test/resources/com/mirada/image

      # Signed by the identity, with the hardened runtime notarization requires.
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 target/dist/Mirada.app
          codesign --display --verbose=2 target/dist/Mirada.app 2>&1 | grep -E 'Authority|Signature|flags'
          codesign --display --verbose=2 target/dist/Mirada.app 2>&1 | grep -qxF "Authority=$MIRADA_MAC_IDENTITY"
          codesign --display --verbose=2 target/dist/Mirada.app 2>&1 | grep -q 'runtime'

      # The dmg signed, notarized (when the import step had the API key, always on a tag), stapled,
      # checked with spctl as Gatekeeper will, and then the notarized app launched from it, under the
      # hardened runtime (REL-15). A dry run without the secrets signs, checks and launches, and
      # notarizes nothing: Apple refuses a self-signed identity.
      - name: Notarize the dmg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 40
        env:
          MIRADA_NOTARIZE: ${{ steps.macsign.outputs.notarize }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/notarize-mac.sh target/installers/*.dmg src/test/resources/com/mirada/image

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh target/installers branding/mirada.png

      # The deb as a user gets it: installed by apt, which resolves its dependencies, and run from
      # /opt. The app image's smoke test never reaches the package's own layout.
      - name: Install the deb and smoke-test it
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./$(ls target/installers/*.deb)"
          bash scripts/smoke-test.sh /opt/mirada/bin/Mirada src/test/resources/com/mirada/image

      # The AppImage as a user runs it. GitHub's runners have no FUSE to mount it, so the runtime
      # unpacks it first, which runs the same tree.
      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/smoke-test.sh "$(ls target/installers/*.AppImage)" src/test/resources/com/mirada/image

      # One naming scheme across five targets, Mirada-<version>-<target>.<ext> (REL-02): jpackage
      # names its output after the bundle version (1.x on macOS for a 0.x release) and no target.
      - name: Name the installers
        run: |
          set -euo pipefail
          cd target/installers
          shopt -s nullglob
          produced=0
          for file in *; do
            case "$file" in
              *.tar.gz) ext=tar.gz ;;
              *)        ext="${file##*.}" ;;
            esac
            mv -v "$file" "Mirada-$VERSION-${{ matrix.target }}.$ext"
            produced=$((produced + 1))
          done
          [ "$produced" -gt 0 ] || { echo "::error::no installer was produced for ${{ matrix.target }}"; exit 1; }
          ls -la

      # The Linux files unsigned: sign-linux replaces them with the signed ones.
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mirada-${{ matrix.target }}
          path: target/installers/*
          retention-days: 14
          if-no-files-found: error

      # The runner is thrown away, but the keychain holds the private key: removed as soon as the
      # leg is done, whether it passed or not.
      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.MIRADA_MAC_KEYCHAIN != ''
        run: security delete-keychain "$MIRADA_MAC_KEYCHAIN" || true

  # The Linux downloads signed with the family's release key, off the build runners, which run
  # whatever Maven resolves (REL-16): rpmsign in the rpm, a debsigs origin signature in the deb, an
  # .asc beside every file. A release must be signed by the committed key
  # (packaging/linux/signing-key.asc) and no other; what was signed is checked against that public
  # key alone before it replaces the build's unsigned files. A tag without the key fails; a dry run
  # without it signs with a throwaway key.
  sign-linux:
    name: Sign Linux packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rpm carries rpmsign; debsig-verify checks the deb the way a user's policy would.
      - name: Signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm debsig-verify

      # One directory per artifact: linux/Mirada-linux-x64, linux/Mirada-linux-arm64.
      - name: Download the Linux builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Mirada-linux-*
          path: linux

      - name: Sign
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "$LINUX_GPG_KEY" ]; then
            export MIRADA_GPG_KEY="$LINUX_GPG_KEY" MIRADA_GPG_PASSPHRASE="$LINUX_GPG_PASSPHRASE"
            export MIRADA_GPG_EXPECTED_KEY=packaging/linux/signing-key.asc
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error title=Linux signing key missing::LINUX_GPG_KEY is not set; refusing to release unsigned Linux packages"
            exit 1
          else
            echo "::warning title=Throwaway signing key::no LINUX_GPG_KEY, so this dry run signs with a key made for it"
            export GNUPGHOME="$RUNNER_TEMP/throwaway-gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key 'Mirada dry run <dry-run@mirada.invalid>' rsa3072 sign 1d
            MIRADA_GPG_KEY="$(gpg --batch --armor --export-secret-keys)"
            export MIRADA_GPG_KEY
            unset GNUPGHOME
          fi
          mkdir -p key
          bash scripts/sign-linux-packages.sh key/mirada-signing-key.asc linux/*/
          bash scripts/check-linux-signatures.sh key/mirada-signing-key.asc linux/*/
          ls -la linux/*/
          fpr=$(gpg --with-colons --import-options show-only --import key/mirada-signing-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "- Linux: signed with \`$fpr\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed (linux-x64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mirada-linux-x64
          path: linux/Mirada-linux-x64/*
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed (linux-arm64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mirada-linux-arm64
          path: linux/Mirada-linux-arm64/*
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload the public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mirada-signing-key
          path: key/mirada-signing-key.asc
          retention-days: 14
          if-no-files-found: error

  # GitHub releases are immutable: a file missing at publish time can never be added (REL-07). So
  # every expected download is checked here, on a dry run too, before anything is published. A new
  # format or target changes this list, jreleaser.yml's globs and the attestation's subject-path
  # (ReleaseSupplyChainTest keeps the last two equal).
  check-assets:
    name: Release-asset check
    needs: [preflight, sign-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download every build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Mirada-*
          path: artifacts
          merge-multiple: true

      - name: Check the expected files
        run: |
          set -euo pipefail
          expected=()
          for target in linux-x64 linux-arm64; do
            for ext in deb rpm tar.gz AppImage; do
              expected+=("Mirada-$VERSION-$target.$ext" "Mirada-$VERSION-$target.$ext.asc")
            done
          done
          expected+=("Mirada-$VERSION-macos-arm64.dmg" "Mirada-$VERSION-macos-x64.dmg")
          expected+=("Mirada-$VERSION-windows-x64.msi")
          expected+=(mirada-signing-key.asc)
          declare -A wanted
          missing=0
          for file in "${expected[@]}"; do
            wanted[$file]=1
            if [ -s "artifacts/$file" ]; then
              echo "ok       $file"
            else
              echo "::error::missing release asset: $file"
              missing=$((missing + 1))
            fi
          done
          unexpected=0
          for file in artifacts/*; do
            name="$(basename "$file")"
            [ -n "${wanted[$name]:-}" ] || { echo "::error::unexpected file, not in the expected list: $name"; unexpected=$((unexpected + 1)); }
          done
          [ "$missing" = 0 ] || { echo "::error::$missing expected file(s) missing; nothing was published"; exit 1; }
          [ "$unexpected" = 0 ] || { echo "::error::add the new file(s) to this list, or stop producing them"; exit 1; }
          echo "- All ${#expected[@]} release assets present" >> "$GITHUB_STEP_SUMMARY"

      # The notes are this version's section of CHANGELOG.md (REL-04); a tag without one fails here,
      # before anything is published. A dry run falls back to Unreleased.
      - name: Check the release notes
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            bash scripts/release-notes.sh "$VERSION" out/release-notes.md
          else
            bash scripts/release-notes.sh "$VERSION" out/release-notes.md --allow-missing
          fi
          cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"

  # On a tag, publishes. On a dry run, attests (the statements name the branch, not a tag, so
  # `--source-ref refs/tags/…` keeps them from verifying as a release) and runs JReleaser with
  # --dry-run, which publishes nothing (REL-21).
  publish:
    name: Publish
    needs: [preflight, check-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that publishes: the release, and the provenance attestations (OIDC + attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      # JReleaser reads the history and talks to the API with its own token; nothing here pushes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download every build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Mirada-*
          path: artifacts
          merge-multiple: true

      - name: Release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            bash scripts/release-notes.sh "$VERSION" out/release-notes.md
          else
            bash scripts/release-notes.sh "$VERSION" out/release-notes.md --allow-missing
          fi

      # A signed statement, kept by GitHub, that each download was built by this workflow from this
      # commit (REL-18):
      #   gh attestation verify <file> --repo adriandeleon/Mirada --source-ref refs/tags/vX.Y.Z
      # The patterns are exactly jreleaser.yml's files.globs; ReleaseSupplyChainTest keeps the two
      # lists equal. Before JReleaser, so a release never publishes a download without one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/Mirada-*.dmg
            artifacts/Mirada-*.msi
            artifacts/Mirada-*.deb
            artifacts/Mirada-*.rpm
            artifacts/Mirada-*.AppImage
            artifacts/Mirada-*.tar.gz
            artifacts/*.asc

      # JReleaser signs checksums_sha256.txt with the release key through gpg (jreleaser.yml,
      # signing.pgp, COMMAND mode): imported here into a keyring of the job's own, and checked to be
      # the committed key. A tag without it fails; a dry run without it signs with a throwaway key.
      - name: Release key for the checksums
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' batch no-tty "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          if [ -n "$LINUX_GPG_KEY" ]; then
            printf '%s\n' "$LINUX_GPG_KEY" | gpg --quiet --import
            fpr=$(gpg --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
            want=$(gpg --with-colons --import-options show-only --import packaging/linux/signing-key.asc |
              awk -F: '$1 == "fpr" { print $10; exit }')
            [ "$fpr" = "$want" ] || { echo "::error::LINUX_GPG_KEY is $fpr, but packaging/linux/signing-key.asc is $want"; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error title=Release key missing::LINUX_GPG_KEY is not set; refusing to publish unsigned checksums"
            exit 1
          else
            echo "::warning title=Throwaway signing key::no LINUX_GPG_KEY, so this dry run signs the checksums with a key made for it"
            gpg --passphrase '' --quick-gen-key 'Mirada dry run <dry-run@mirada.invalid>' rsa3072 sign 1d
            fpr=$(gpg --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "JRELEASER_GPG_KEYNAME=$fpr" >> "$GITHUB_ENV"

      # The action and the JReleaser it downloads are both pinned; bump them deliberately.
      - name: JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: 1.26.0
          arguments: ${{ github.event_name == 'workflow_dispatch' && 'full-release --dry-run' || 'full-release' }}
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release key's passphrase; empty for the dry run's throwaway key, which has none.
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}

      - name: Upload the JReleaser output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
            out/jreleaser/checksums/checksums_sha256.txt
            out/jreleaser/signatures/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove the release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-gnupg"

  # The winget manifests, written from the published MSI, validated, installed from and uploaded,
  # ready for a pull request to microsoft/winget-pkgs (AGENTS.md, "Releasing"). A tag only: a dry
  # run has no published MSI.
  winget:
    name: winget
    needs: [preflight, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.preflight.outputs.version }}

  # Reopens main at the next patch -SNAPSHOT, through a pull request (REL-06): main's required
  # checks refuse a direct push. Skipped for pre-releases (a tag with a suffix), which do not move
  # the line, and on a dry run.
  #
  # A pull request opened with GITHUB_TOKEN starts no workflows, so CI is dispatched on the branch:
  # its runs report the same check names on the same commit. Opening the pull request needs
  # Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests";
  # without it the branch is still pushed and the summary links to it.
  bump:
    name: Reopen main for development
    needs: [preflight, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      RELEASED: ${{ needs.preflight.outputs.version }}
    steps:
      # The one checkout that keeps its credentials: this job pushes a branch.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(./mvnw -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          # Only when main still sits on the released version; anything else means a person got
          # there first.
          if [ "$current" != "$RELEASED" ]; then
            echo "main is at $current, not $RELEASED: nothing to bump."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$RELEASED"
          next="$major.$minor.$((patch + 1))-SNAPSHOT"
          branch="chore/reopen-$major.$minor.$((patch + 1))"
          title="Reopen main at $next after $GITHUB_REF_NAME"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists: nothing to do."
            exit 0
          fi

          ./mvnw -B -q --no-transfer-progress versions:set -DnewVersion="$next" -DgenerateBackupPoms=false
          # An empty Unreleased section above the version just released, for the next entries.
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            awk '!done && /^## \[/ { print "## [Unreleased]\n"; done = 1 } { print }' CHANGELOG.md > CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$title"
          git push origin "$branch"

          # The required checks, on the commit just pushed.
          gh workflow run ci.yml --ref "$branch"

          body="$GITHUB_REF_NAME is published. This sets \`pom.xml\` to $next and opens an Unreleased section in CHANGELOG.md. CI was dispatched on the branch, as a pull request opened by GITHUB_TOKEN starts no workflows."
          if url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body"); then
            echo "Merge [the pull request]($url) to reopen main at \`$next\`." >> "$GITHUB_STEP_SUMMARY"
          else
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::could not open the pull request; $branch is pushed: $compare"
            echo "[Open the pull request]($compare) for \`$branch\` and merge it to reopen main at \`$next\`." >> "$GITHUB_STEP_SUMMARY"
          fi
