name: Bug report
description: Something in Mirada went wrong. Help → Report a Problem (or `mirada --report`) fills in the details.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what Mirada did instead. If it is about one picture, say what kind of file it is (and attach it if you can share it).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, how?
      placeholder: |
        1. Open …
        2. Press …
  # Report a Problem fills the two fields below by their ids; keep `environment` and `report`.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Mirada version, commit, Java, JavaFX, codecs, OS. Filled in when you report from the app; otherwise copy it from About → Copy details.
      render: text
  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: The redacted report from the app. Read it before you submit — anything left in it becomes public.
      render: text
